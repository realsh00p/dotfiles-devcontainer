# Use fish shell
set -g default-command fish

# Enable global mouse mode 
set -g mouse on

# Disable mouse dragging/resizing
unbind -T copy-mode-vi MouseDrag1Pane
unbind -T root MouseDrag1Border

# Disable right-click bindings
unbind -T root MouseDown3Pane
unbind -T root M-MouseDown3Pane
unbind -T root MouseDown3Status
unbind -T root MouseDown3StatusLeft

# Bind Alt + Right-Click Drag anywhere on a pane border to resize it
bind-key -n M-MouseDrag3Pane resize-pane -M

# Ensure vi mode is on
setw -g mode-keys vi

# Copy to BOTH the tmux buffer AND the system clipboard
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Optional: Trigger copy if you use the mouse to highlight
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Split panes horizontally (top and bottom) using Ctrl+Shift+O
bind-key -n C-O split-window -v -c "#{pane_current_path}"

# Split panes vertically (left and right) using Ctrl+Shift+E
bind-key -n C-E split-window -h -c "#{pane_current_path}"

# Pane switching
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

